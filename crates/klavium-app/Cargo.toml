[package]
name = "klavium-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Клиентское приложение Klavium: трей, логирование, конфиг, single instance"

[[bin]]
name = "klavium"
path = "src/main.rs"

[dependencies]
klavium-core = { path = "../klavium-core" }
klavium-platform = { path = "../klavium-platform" }
klavium-ui = { path = "../klavium-ui" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"
cpal = "0.18"
whisper-rs = "0.16"
ureq = "2"
flacenc = "0.5"
zip = "2"

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
